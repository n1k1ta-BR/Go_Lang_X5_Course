basePath: /api/v1
definitions:
  httpapi.CreateOrderRequest:
    properties:
      customer:
        example: Алиса
        minLength: 1
        type: string
    required:
    - customer
    type: object
  httpapi.ErrorResponse:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      error:
        example: customer is required
        type: string
    required:
    - code
    - error
    type: object
  httpapi.OrderResponse:
    properties:
      customer:
        example: Алиса
        type: string
      id:
        example: 1
        minimum: 1
        type: integer
      status:
        enum:
        - new
        - cancelled
        example: new
        type: string
    required:
    - customer
    - id
    - status
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    required:
    - status
    type: object
  httpapi.UpdateStatusRequest:
    properties:
      status:
        enum:
        - cancelled
        example: cancelled
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  title: Orders API
  version: "1.0"
paths:
  /orders:
    get:
      description: Возвращает страницу заказов по возрастанию id. Фильтр применяется
        ко всему списку до пагинации. Пустая страница возвращается как []. Новые заказы
        имеют статус new, поэтому status=cancelled возвращает пустой массив до первой
        отмены. Явные пустые, повторные и неизвестные query-параметры запрещены. limit
        и offset допускают только десятичные цифры в диапазоне int.
      parameters:
      - default: 20
        description: Размер страницы
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Количество пропускаемых заказов
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Фильтр по статусу
        enum:
        - new
        - cancelled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.OrderResponse'
            type: array
        "400":
          description: INVALID_QUERY
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Получить список заказов
      tags:
      - orders
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для создания заказа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Путь к созданному заказу
              type: string
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: Слишком большое тело запроса
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "415":
          description: Неподдерживаемый тип содержимого
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Создать заказ
      tags:
      - orders
  /orders/{id}:
    get:
      parameters:
      - description: Положительный номер заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: INVALID_ID
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: ORDER_NOT_FOUND
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Получить заказ по id
      tags:
      - orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Разрешён переход new в cancelled. Повторная отмена возвращает 409
        ORDER_ALREADY_CANCELLED.
      parameters:
      - description: Положительный номер заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Новый статус заказа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: INVALID_ID, INVALID_JSON или VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: ORDER_NOT_FOUND
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: ORDER_ALREADY_CANCELLED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: BODY_TOO_LARGE
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Отменить заказ
      tags:
      - orders
  /status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Проверить состояние API
      tags:
      - status
swagger: "2.0"
